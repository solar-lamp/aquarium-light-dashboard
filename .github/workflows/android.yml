name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to publish the APK as a release on main

    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up release signing key
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Warn about missing signing key
        if: env.SIGNING_KEYSTORE_BASE64 == ''
        run: >
          echo "::warning::No signing key secrets set. The APK is signed with a
          throwaway debug key, so installing a later build over this one will
          fail until you uninstall first. See README → Android app."

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/aquarium-light.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: aquarium-light-apk
          path: ${{ runner.temp }}/aquarium-light.apk

      - name: Publish as the "app-latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --cleanup-tag --yes || true
          gh release create app-latest "$RUNNER_TEMP/aquarium-light.apk" \
            --target "$GITHUB_SHA" \
            --title "Android app (latest build)" \
            --notes "Version $VERSION_NAME, built from $GITHUB_SHA. Download aquarium-light.apk on your phone and open it to install."
